    name: fountain 0.1.3
    reason: "Installs but crashes on import under Python 3.12 because its regex uses LOCALE with a str pattern."
    replacement: screenplain
  - id: deepfilternet
    name: DeepFilterNet 0.5.6
    reason: "No CPython 3.12 wheel; source build requires Rust/Cargo and pins old NumPy/packaging ranges."
    replacement: "FFmpeg speech filters plus Pedalboard/PyLoudnorm deterministic studio chain; re-evaluate only as an isolated Rust/older-Python service if measured noise requires it."
