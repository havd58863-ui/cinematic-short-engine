name: Gate — writing model round 2

# Round 2 of the writing-model acceptance gate (see config/writing_gate.yaml).
# 8 parallel jobs = model x account x task_type, 6 generations each (48 total).
# The shared engine.validation module judges every output; targeted repairs are
# bounded by config. Results are pushed to branch `gate-results` and summarized
# per job for phone reading. NEVER auto-runs: manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: [gemma4:12b, qwen3:14b]
        account: [account_01_psychology, account_02_storytelling]
        task_type: [write, edit]
    env:
      MODEL: ${{ matrix.model }}
      ACCOUNT: ${{ matrix.account }}
      TASK_TYPE: ${{ matrix.task_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (models are 8-9 GB each)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked harness dependencies
        run: python -m pip install --disable-pip-version-check pydantic==2.14.1 pyyaml==6.0.3

      - name: Install Ollama (pinned 0.40.6, official release tarball)
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          curl -fsSL --retry 3 -o /tmp/ollama.tar.zst \
            https://github.com/ollama/ollama/releases/download/v0.40.6/ollama-linux-amd64.tar.zst
          sudo tar --use-compress-program=unzstd -xf /tmp/ollama.tar.zst -C /usr/local
          rm -f /tmp/ollama.tar.zst
          ollama --version

      - name: Start Ollama and wait for health
        run: |
          set -euo pipefail
          OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then echo; echo "ollama up"; break; fi
            sleep 2
          done
          echo "cpus: $(nproc)"; free -h; df -h / | tail -1

      - name: Run writing gate round 2 (${{ matrix.model }} / ${{ matrix.account }} / ${{ matrix.task_type }})
        timeout-minutes: 210
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          SAFE_MODEL=$(echo "$MODEL" | tr ':' '-')
          echo "SAFE_MODEL=$SAFE_MODEL" >> "$GITHUB_ENV"
          OUT="results/writing-gate-r2/${{ github.run_id }}/$SAFE_MODEL/${ACCOUNT}-${TASK_TYPE}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python scripts/benchmark_writer_v2.py \
            --model "$MODEL" --account "$ACCOUNT" --task-type "$TASK_TYPE" --out "$OUT"

      - name: Write run summary (phone-readable samples)
        if: always()
        run: |
          {
            echo "### Writing gate R2 — $MODEL · $ACCOUNT · $TASK_TYPE (run ${{ github.run_id }})"
            echo
            if [ -f "$OUT/samples.md" ]; then cat "$OUT/samples.md"; else echo "_no samples produced — see logs_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push results to gate-results branch
        if: always()
        run: |
          set -euo pipefail
          [ -d "$OUT" ] || { echo "no results dir"; exit 0; }
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for try in 1 2 3 4 5; do
            rm -rf /tmp/gr
            if ! git clone --quiet --depth 1 --branch gate-results "$REMOTE" /tmp/gr 2>/dev/null; then
              mkdir -p /tmp/gr
              git -C /tmp/gr init -q -b gate-results
              git -C /tmp/gr remote add origin "$REMOTE"
            fi
            mkdir -p "/tmp/gr/$OUT"
            cp -a "$OUT/." "/tmp/gr/$OUT/"
            git -C /tmp/gr config user.name "writing-gate"
            git -C /tmp/gr config user.email "actions@users.noreply.github.com"
            git -C /tmp/gr add -A
            if git -C /tmp/gr diff --cached --quiet; then echo "nothing to commit"; break; fi
            git -C /tmp/gr commit -q -m "Writing gate R2 ${{ github.run_id }}: $MODEL $ACCOUNT $TASK_TYPE"
            if git -C /tmp/gr push -q origin gate-results; then echo "pushed ✅"; break; fi
            echo "push race, retry $try"; sleep $((RANDOM % 10 + 5))
          done

      - name: Upload results artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-gate-r2-${{ env.SAFE_MODEL }}-${{ matrix.account }}-${{ matrix.task_type }}-${{ github.run_id }}
          path: results/writing-gate-r2/${{ github.run_id }}/
          if-no-files-found: warn
