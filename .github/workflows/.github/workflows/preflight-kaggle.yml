name: Preflight — Kaggle GPU

# One-shot diagnostic (NOT production): verifies the KAGGLE_JSON secret,
# pushes a tiny GPU probe kernel (nvidia-smi + torch), waits for it to
# finish, and pulls back its output. Answers: auth OK? GPU granted
# (Kaggle phone verification)? which GPU/VRAM? Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare Kaggle credentials
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_JSON:-}" ]; then
            {
              echo "### Kaggle preflight — credential diagnosis"
              echo
              echo "Secret **KAGGLE_JSON** was not found at all. Check the secret's name (exactly KAGGLE_JSON)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Secret KAGGLE_JSON is missing (the name must be exactly KAGGLE_JSON)"
            exit 1
          fi
          python3 - << 'PY'
          import json, os, sys
          s = os.environ["KAGGLE_JSON"].strip().lstrip("\ufeff")
          shape = "json-object" if s.startswith("{") else "bare-token-or-key"
          print(f"secret shape: {shape} | length: {len(s)} chars")
          def fail(msg):
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  open(sp, "a").write("### Kaggle preflight — credential diagnosis\n\n" + msg + "\n")
              print("::error::" + msg)
              sys.exit(1)
          if not s:
              fail("KAGGLE_JSON secret is EMPTY.")
          if not s.startswith("{"):
              fail("KAGGLE_JSON does not start with '{'. Paste the ENTIRE kaggle.json content: one line that starts with { and ends with }.")
          try:
              d = json.loads(s)
          except Exception as exc:
              fail(f"KAGGLE_JSON looks like JSON but does not parse ({type(exc).__name__}). Re-copy the whole single line, first char {{ to last char }}.")
          if not (isinstance(d, dict) and d.get("username") and d.get("key")):
              fail("Parsed JSON lacks username and/or key. Use the file from 'Create Legacy API Key' exactly as downloaded.")
          home = os.path.expanduser("~/.kaggle")
          os.makedirs(home, exist_ok=True)
          path = os.path.join(home, "kaggle.json")
          open(path, "w").write(json.dumps(d))
          os.chmod(path, 0o600)
          genv = os.environ.get("GITHUB_ENV")
          if genv:
              open(genv, "a").write(f"KAGGLE_USERNAME={d['username']}\n")
          print("credentials OK | username:", d["username"])
          PY

      - name: Install Kaggle CLI (diagnostic, unpinned on purpose)
        run: python3 -m pip install --disable-pip-version-check -q kaggle

      - name: Auth check
        run: |
          set -euo pipefail
          echo "== my kernels =="
          kaggle kernels list --mine --page-size 3 || true
          echo "== my datasets =="
          kaggle datasets list --mine || true

      - name: Build tiny GPU probe kernel
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > probe/kernel-metadata.json << JSON
          {
            "id": "$KAGGLE_USERNAME/cine-engine-gpu-probe",
            "title": "cine-engine-gpu-probe",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON
          cat > probe/probe.py << 'PY'
          import json, subprocess, sys, time
          print("python:", sys.version)
          print("== nvidia-smi ==")
          r = subprocess.run(["nvidia-smi"], capture_output=True, text=True)
          print(r.stdout or r.stderr)
          info = {"nvidia_smi_exit": r.returncode}
          try:
              import torch
              info["torch"] = torch.__version__
              info["cuda_available"] = torch.cuda.is_available()
              if torch.cuda.is_available():
                  info["device"] = torch.cuda.get_device_name(0)
                  info["vram_gb"] = round(torch.cuda.get_device_properties(0).total_memory / 1e9, 2)
                  x = torch.randn(1024, 1024, device="cuda")
                  t0 = time.time()
                  for _ in range(20):
                      x = x @ x
                  torch.cuda.synchronize()
                  info["matmul20_seconds"] = round(time.time() - t0, 3)
          except Exception as exc:  # named, never hidden
              info["torch_error"] = f"{type(exc).__name__}: {exc}"
          try:
              import shutil
              u = shutil.disk_usage("/kaggle/working")
              info["disk_working_gb"] = round(u.total / 1e9, 1)
          except Exception:
              pass
          json.dump(info, open("/kaggle/working/gpu_probe.json", "w"), indent=2)
          print("PROBE_JSON:", json.dumps(info))
          PY
          ls -la probe

      - name: Push probe kernel and wait for the GPU verdict
        run: |
          set -euo pipefail
          kaggle kernels push -p probe
          for i in $(seq 1 40); do
            out=$(kaggle kernels status "$KAGGLE_USERNAME/cine-engine-gpu-probe" 2>&1 || true)
            echo "poll $i: $out"
            low=$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')
            case "$low" in
              *complete*) echo "kernel complete"; break ;;
              *error*|*cancel*) echo "::error::kernel ended in a bad state — read probe_out logs in summary/artifact"; break ;;
            esac
            sleep 30
          done

      - name: Fetch probe output and write summary (phone-readable)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p probe_out
          if [ -n "${KAGGLE_USERNAME:-}" ]; then
            kaggle kernels output "$KAGGLE_USERNAME/cine-engine-gpu-probe" -p probe_out || true
          else
            echo "no username (credentials step failed earlier) — nothing to fetch"
          fi
          ls -la probe_out || true
          {
            echo "### Kaggle GPU preflight (run ${{ github.run_id }})"
            echo
            if [ -f probe_out/gpu_probe.json ]; then
              echo '```json'
              cat probe_out/gpu_probe.json
              echo
              echo '```'
            else
              echo "_no gpu_probe.json returned — kernel log below tells why._"
            fi
            for f in probe_out/*.log; do
              if [ -f "$f" ]; then
                echo
                echo "#### $f"
                echo '```'
                tail -c 4000 "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-probe-${{ github.run_id }}
          path: probe_out/
          if-no-files-found: warn
