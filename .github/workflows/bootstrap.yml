name: Bootstrap clean rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository content with new-system.zip
        run: |
          set -euo pipefail
          if [ ! -f new-system.zip ]; then
            echo "::error::new-system.zip is missing at the repository root. Upload it first, then run again."
            exit 1
          fi
          rm -rf /tmp/newsystem && mkdir -p /tmp/newsystem
          unzip -oq new-system.zip -d /tmp/newsystem
          # Safety: the archive must look like our engine, not an arbitrary zip.
          test -f /tmp/newsystem/pyproject.toml
          test -f /tmp/newsystem/config/toolchain.yaml
          # Wipe ONLY top-level entries (never descend into .git), then copy the clean tree.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/newsystem/. .
          # GITHUB_TOKEN is forbidden from pushing workflow-file changes (GitHub platform rule).
          # Restore the workflows folder exactly as it was so this commit never touches it;
          # the owner adds verify.yml/build-images.yml manually afterwards.
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          git config user.name "cinematic-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Clean rebuild: verified Phase 0 foundation (tools locked, DNA configs, CI)"
            git push origin HEAD:main
          fi
