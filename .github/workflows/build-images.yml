name: Build production images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "requirements/locks/**"
      - "src/**"
      - "config/**"
      - "vendor/openmontage.lock.json"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to GHCR after smoke checks"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  python-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            lock: requirements/locks/core.txt
            apt: "ca-certificates ffmpeg fonts-noto-core git libgomp1 libsndfile1"
          - name: media
            lock: requirements/locks/media.txt
            apt: "ca-certificates ffmpeg fonts-noto-core git libgomp1 libsndfile1"
          - name: ml
            lock: requirements/locks/ml.txt
            apt: "ca-certificates fonts-noto-core git libgomp1"
          - name: align
            lock: requirements/locks/align.txt
            apt: "ca-certificates ffmpeg fonts-noto-core git libgomp1 libsndfile1"
          - name: voice-fallback
            lock: requirements/locks/voice-fallback.txt
            apt: "ca-certificates espeak-ng fonts-noto-core git libgomp1 libsndfile1"
    env:
      PUSH_IMAGES: ${{ github.event_name == 'push' || inputs.push_images }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "LOCAL_IMAGE=cinematic-short-engine-${{ matrix.name }}:ci" >> "$GITHUB_ENV"
          echo "REMOTE_IMAGE=ghcr.io/${repo}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker buildx build --load \
            --file docker/Dockerfile \
            --build-arg REQUIREMENTS_LOCK='${{ matrix.lock }}' \
            --build-arg APT_PACKAGES='${{ matrix.apt }}' \
            --tag "$LOCAL_IMAGE" \
            --tag "$REMOTE_IMAGE:${GITHUB_SHA}" \
            --tag "$REMOTE_IMAGE:latest" \
            --cache-from "type=gha,scope=${{ matrix.name }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.name }}" \
            .
      - name: Smoke test image
        run: |
          docker run --rm "$LOCAL_IMAGE" validate-config --json
          docker run --rm "$LOCAL_IMAGE" validate-toolchain --json
          docker run --rm "$LOCAL_IMAGE" doctor --json
      - name: Push image
        if: env.PUSH_IMAGES == 'true'
        run: |
          docker push "$REMOTE_IMAGE:${GITHUB_SHA}"
          docker push "$REMOTE_IMAGE:latest"

  remotion-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUSH_IMAGES: ${{ github.event_name == 'push' || inputs.push_images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Fetch pinned OpenMontage
        run: python scripts/fetch_openmontage.py
      - name: Prepare image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "LOCAL_IMAGE=cinematic-short-engine-remotion:ci" >> "$GITHUB_ENV"
          echo "REMOTE_IMAGE=ghcr.io/${repo}-remotion" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke test Remotion image
        run: |
          docker buildx build --load \
            --file docker/Dockerfile.remotion \
            --tag "$LOCAL_IMAGE" \
            --tag "$REMOTE_IMAGE:${GITHUB_SHA}" \
            --tag "$REMOTE_IMAGE:latest" \
            --cache-from "type=gha,scope=remotion" \
            --cache-to "type=gha,mode=max,scope=remotion" \
            .
          docker run --rm "$LOCAL_IMAGE"
      - name: Push image
        if: env.PUSH_IMAGES == 'true'
        run: |
          docker push "$REMOTE_IMAGE:${GITHUB_SHA}"
          docker push "$REMOTE_IMAGE:latest"
