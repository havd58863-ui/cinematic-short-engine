name: Verify foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.3
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements/locks/dev.txt
      - name: Lint and test
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/python -m ruff check src tests scripts
          .venv/bin/python -m pytest -q
          .venv/bin/python -m engine.cli validate-config --json
          .venv/bin/python -m engine.cli validate-toolchain --json

  openmontage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch pinned OpenMontage
        run: python scripts/fetch_openmontage.py
      - name: Install locked OpenMontage test environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.3
          uv venv .venv-openmontage --python 3.12
          uv pip install --python .venv-openmontage/bin/python -r requirements/locks/openmontage.txt
      - name: Run selected upstream contract tests
        working-directory: vendor/openmontage
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/openmontage
        run: |
          ../../.venv-openmontage/bin/python -m compileall -q tools schemas
          ../../.venv-openmontage/bin/python -m pytest -q \
            tests/contracts/test_pipeline_catalog.py \
            tests/contracts/test_pipeline_manifest_categories.py \
            tests/contracts/test_agent_skill_pointers.py \
            tests/contracts/test_phase0_contracts.py \
            tests/styles/test_playbook_catalog.py \
            tests/contracts/test_remotion_video_transition_contract.py
      - name: Verify Remotion lock and TypeScript
        working-directory: vendor/openmontage/remotion-composer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/tsc --noEmit
