name: Preflight — Kaggle GPU

# One-shot diagnostic (NOT production): resolves Kaggle credentials from
# whatever secret shape the owner managed to paste (full kaggle.json,
# username+key secrets, bare key with a username secret, or a KGAT API
# token), proves auth with a live CLI call, then pushes a tiny GPU probe
# kernel (nvidia-smi + torch). Answers: auth OK? GPU granted (Kaggle
# phone verification)? which GPU/VRAM? Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Kaggle CLI (diagnostic, unpinned on purpose)
        run: python3 -m pip install --disable-pip-version-check -q kaggle

      - name: Resolve Kaggle credentials (shape-forgiving, self-diagnosing)
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
          KAGGLE_USERNAME_IN: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY_IN: ${{ secrets.KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess, sys
          raw = os.environ.get("KAGGLE_JSON", "").strip().lstrip("\ufeff")
          user_in = os.environ.get("KAGGLE_USERNAME_IN", "").strip()
          key_in = os.environ.get("KAGGLE_KEY_IN", "").strip()
          home = os.path.expanduser("~/.kaggle")
          os.makedirs(home, exist_ok=True)
          cred_file = os.path.join(home, "kaggle.json")
          base_env = {k: v for k, v in os.environ.items() if k != "KAGGLE_API_TOKEN"}

          def summary(msg):
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  open(sp, "a").write(msg.rstrip() + "\n\n")

          def cli(args, env):
              try:
                  r = subprocess.run(["kaggle", *args], capture_output=True, text=True,
                                     timeout=180, env=env)
                  return r.returncode, (r.stdout + "\n" + r.stderr).strip()
              except Exception as exc:  # named, never hidden
                  return 99, f"{type(exc).__name__}: {exc}"

          def set_file(cred):
              if cred:
                  open(cred_file, "w").write(json.dumps(cred))
                  os.chmod(cred_file, 0o600)
              elif os.path.exists(cred_file):
                  os.remove(cred_file)

          candidates = []
          if user_in and key_in:
              candidates.append(("username+key secrets", {"username": user_in, "key": key_in}, None))
          parsed = None
          if raw.startswith("{"):
              try:
                  parsed = json.loads(raw)
              except Exception:
                  parsed = None
          if isinstance(parsed, dict) and parsed.get("username") and parsed.get("key"):
              candidates.append(("full kaggle.json secret", parsed, None))
          elif raw:
              if user_in:
                  candidates.append(("secret-as-key + username secret",
                                     {"username": user_in, "key": raw}, None))
              candidates.append(("secret as KGAT API token", None, raw))
          if key_in and not (user_in and key_in):
              print("note: KAGGLE_KEY present without username — will pair only if username resolves")
              if user_in:
                  candidates.append(("key secret + username secret",
                                     {"username": user_in, "key": key_in}, None))

          rc, ver = cli(["--version"], base_env)
          print("kaggle CLI:", ver.splitlines()[0] if ver else f"rc={rc}")
          if not candidates:
              msg = ("### Kaggle preflight — credential diagnosis\n\n"
                     "No usable credential material found. Need ONE of: full kaggle.json "
                     "in secret KAGGLE_JSON, or secrets KAGGLE_USERNAME + KAGGLE_KEY, "
                     "or a Kaggle API token in KAGGLE_JSON plus KAGGLE_USERNAME.")
              summary(msg)
              print("::error::" + msg.replace("\n", " "))
              sys.exit(1)

          winner = None
          for name, cred, token in candidates:
              env = dict(base_env)
              set_file(cred)
              if token:
                  env["KAGGLE_API_TOKEN"] = token
              rc, out = cli(["datasets", "list", "--mine"], env)
              print(f"attempt [{name}]: rc={rc}")
              if out:
                  print("   tail:", " | ".join(out.splitlines()[-2:])[:300])
              if rc == 0:
                  winner = (name, cred, token, env)
                  break

          if not winner:
              set_file(None)
              msg = ("### Kaggle preflight — credential diagnosis\n\n"
                     "None of the pasted credential shapes authenticated on Kaggle.\n"
                     "Fix: download a fresh file via Kaggle Settings > API Tokens > "
                     "Create Legacy API Key, then set secret KAGGLE_KEY to the long "
                     "'key' value and KAGGLE_USERNAME to your Kaggle username.")
              summary(msg)
              print("::error::no credential candidate authenticated — see job summary")
              sys.exit(1)

          name, cred, token, env = winner
          genv = os.environ.get("GITHUB_ENV")
          username = cred["username"] if cred else user_in
          if token:
              if genv:
                  open(genv, "a").write(f"KAGGLE_API_TOKEN={token}\n")
              if not username:
                  rc, out = cli(["config", "view"], env)
                  for line in out.splitlines():
                      if "username" in line.lower() and ":" in line:
                          username = line.split(":", 1)[1].strip().strip('"')
                          break
          if not username:
              msg = ("### Kaggle preflight — credential diagnosis\n\n"
                     "The pasted API token authenticated, but your Kaggle USERNAME is "
                     "unknown and is needed to push kernels. Add a small secret "
                     "KAGGLE_USERNAME with your Kaggle username, then re-run.")
              summary(msg)
              print("::error::token authenticated but username unresolved — see job summary")
              sys.exit(1)
          if genv:
              open(genv, "a").write(f"KAGGLE_USERNAME={username}\n")
          print(f"credentials OK via [{name}] | username: {username}")
          summary(f"Kaggle credentials resolved via **{name}** (username: {username}).")
          PY

      - name: Build tiny GPU probe kernel
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > probe/kernel-metadata.json << JSON
          {
            "id": "$KAGGLE_USERNAME/cine-engine-gpu-probe",
            "title": "cine-engine-gpu-probe",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON
          cat > probe/probe.py << 'PY'
          import json, subprocess, sys, time
          print("python:", sys.version)
          print("== nvidia-smi ==")
          r = subprocess.run(["nvidia-smi"], capture_output=True, text=True)
          print(r.stdout or r.stderr)
          info = {"nvidia_smi_exit": r.returncode}
          try:
              import torch
              info["torch"] = torch.__version__
              info["cuda_available"] = torch.cuda.is_available()
              if torch.cuda.is_available():
                  info["device"] = torch.cuda.get_device_name(0)
                  info["vram_gb"] = round(torch.cuda.get_device_properties(0).total_memory / 1e9, 2)
                  x = torch.randn(1024, 1024, device="cuda")
                  t0 = time.time()
                  for _ in range(20):
                      x = x @ x
                  torch.cuda.synchronize()
                  info["matmul20_seconds"] = round(time.time() - t0, 3)
          except Exception as exc:  # named, never hidden
              info["torch_error"] = f"{type(exc).__name__}: {exc}"
          try:
              import shutil
              u = shutil.disk_usage("/kaggle/working")
              info["disk_working_gb"] = round(u.total / 1e9, 1)
          except Exception:
              pass
          json.dump(info, open("/kaggle/working/gpu_probe.json", "w"), indent=2)
          print("PROBE_JSON:", json.dumps(info))
          PY
          ls -la probe

      - name: Push probe kernel and wait for the GPU verdict
        run: |
          set -euo pipefail
          kaggle kernels push -p probe
          for i in $(seq 1 40); do
            out=$(kaggle kernels status "$KAGGLE_USERNAME/cine-engine-gpu-probe" 2>&1 || true)
            echo "poll $i: $out"
            low=$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')
            case "$low" in
              *complete*) echo "kernel complete"; break ;;
              *error*|*cancel*) echo "::error::kernel ended in a bad state — read probe_out logs in summary/artifact"; break ;;
            esac
            sleep 30
          done

      - name: Fetch probe output and write summary (phone-readable)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p probe_out
          if [ -n "${KAGGLE_USERNAME:-}" ]; then
            kaggle kernels output "$KAGGLE_USERNAME/cine-engine-gpu-probe" -p probe_out || true
          else
            echo "no username (credentials step failed earlier) — nothing to fetch"
          fi
          ls -la probe_out || true
          {
            echo "### Kaggle GPU preflight (run ${{ github.run_id }})"
            echo
            if [ -f probe_out/gpu_probe.json ]; then
              echo '```json'
              cat probe_out/gpu_probe.json
              echo
              echo '```'
            else
              echo "_no gpu_probe.json returned — kernel log below tells why._"
            fi
            for f in probe_out/*.log; do
              if [ -f "$f" ]; then
                echo
                echo "#### $f"
                echo '```'
                tail -c 4000 "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-probe-${{ github.run_id }}
          path: probe_out/
          if-no-files-found: warn
