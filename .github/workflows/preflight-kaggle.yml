name: Preflight — Kaggle GPU

# One-shot diagnostic (NOT production): resolves the existing Kaggle secret,
# proves auth with a live CLI call, then pushes a tiny T4 GPU probe kernel.
# Answers: auth OK? GPU granted? which GPU/VRAM? Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Kaggle CLI 2.2.5 in an isolated venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/kaggle-venv"
          "$RUNNER_TEMP/kaggle-venv/bin/python" -m pip install --disable-pip-version-check -q "kaggle==2.2.5"
          echo "$RUNNER_TEMP/kaggle-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kaggle-venv/bin/kaggle" --version

      - name: Resolve Kaggle credentials v7 (compact proven-path recovery)
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
          KAGGLE_USERNAME_IN: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY_IN: ${{ secrets.KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, re, subprocess, sys
          raw = os.environ.get("KAGGLE_JSON", "").strip().lstrip("\ufeff")
          user_in = os.environ.get("KAGGLE_USERNAME_IN", "").strip()
          key_in = os.environ.get("KAGGLE_KEY_IN", "").strip()
          home = os.path.expanduser("~/.kaggle")
          os.makedirs(home, exist_ok=True)
          cred_file = os.path.join(home, "kaggle.json")
          base_env = {k: v for k, v in os.environ.items() if k != "KAGGLE_API_TOKEN"}
          secret_values = [v for v in (raw, key_in) if v]

          def clean(value):
              value = (value or "").strip()
              if value[:1] in ("\"", "'"):
                  end = value.find(value[0], 1)
                  if end > 0:
                      value = value[1:end]
              else:
                  parts = value.split()
                  value = parts[0] if parts else ""
              return value.strip().rstrip(";,").strip()

          def add(items, value):
              value = clean(value)
              if value and value not in items:
                  items.append(value)
                  secret_values.append(value)
              return value

          def summary(msg):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  open(path, "a").write(msg.rstrip() + "\n\n")

          def cli(args, env):
              try:
                  r = subprocess.run(["kaggle", *args], capture_output=True, text=True,
                                     timeout=180, env=env)
                  out = (r.stdout + "\n" + r.stderr).strip()
                  for secret in sorted(set(secret_values), key=len, reverse=True):
                      if secret:
                          out = out.replace(secret, "[redacted]")
                  return r.returncode, out
              except Exception as exc:  # named, never hidden
                  return 99, f"{type(exc).__name__}: {exc}"

          def set_file(cred):
              if cred:
                  open(cred_file, "w").write(json.dumps(cred))
                  os.chmod(cred_file, 0o600)
              elif os.path.exists(cred_file):
                  os.remove(cred_file)

          def field(name):
              match = re.search(
                  r"(?i)[\"']?" + re.escape(name) +
                  r"[\"']?\s*[:=]\s*(?:\"([^\"]*)\"|'([^']*)'|([^\s,;}\]]+))", raw)
              if not match:
                  return ""
              return next((g.strip() for g in match.groups() if g is not None), "")

          tokens = []
          for match in re.finditer(
              r"(?im)^\s*(?:export\s+)?(KAGGLE_API_TOKEN|KAGGLE_TOKEN|KAGGLE_USERNAME|KAGGLE_KEY)\s*=\s*([^\r\n#;]+)",
              raw):
              name, value = match.group(1).upper(), clean(match.group(2))
              if name in ("KAGGLE_API_TOKEN", "KAGGLE_TOKEN"):
                  add(tokens, value)
              elif name == "KAGGLE_USERNAME" and not user_in:
                  user_in = value
              elif name == "KAGGLE_KEY" and not key_in:
                  key_in = value
                  secret_values.append(key_in)

          compact = re.sub(r"\s+", "", raw)
          labels = {"KAGGLE_API_TOKEN", "KAGGLE_USERNAME", "KAGGLE_KEY", "KAGGLE_TOKEN",
                    "AUTHORIZATION", "ACCESS_TOKEN", "API_TOKEN"}

          def token_like(text):
              values = []
              for value in re.findall(r"[A-Za-z0-9._~+\-/=]{16,}", text or ""):
                  value = value.strip("._~+-/=")
                  if len(value) < 16 or value.upper() in labels:
                      continue
                  has_letter = any(ch.isalpha() for ch in value)
                  has_digit = any(ch.isdigit() for ch in value)
                  has_symbol = any(ch in "._~+-/=" for ch in value)
                  if not has_digit and not (has_symbol and len(value) >= 24):
                      continue
                  if not has_letter and len(value) < 32:
                      continue
                  add(values, value)
              return sorted(values, key=len, reverse=True)

          generic = []
          for text in (raw, compact):
              for token in re.findall(r"KGAT_[A-Za-z0-9._~+\-/=]+", text):
                  add(tokens, token)
              for value in token_like(text):
                  add(generic, value)
          for value in generic:
              add(tokens, value)

          partial_user = field("username")
          partial_key = field("key")
          partial_token = field("api_token") or field("access_token") or field("token")
          if partial_key:
              secret_values.append(partial_key)
              add(tokens, partial_key)
          if partial_token:
              add(tokens, partial_token)
          if raw and not raw.startswith("{") and "=" not in raw and not any(ch.isspace() for ch in raw):
              add(tokens, raw)

          candidates = []
          if user_in and key_in:
              candidates.append(("username+key secrets", {"username": user_in, "key": key_in}, None))
          parsed = None
          if raw.startswith("{"):
              try:
                  parsed = json.loads(raw)
              except Exception:
                  parsed = None
          if isinstance(parsed, dict) and parsed.get("username") and parsed.get("key"):
              secret_values.append(str(parsed["key"]))
              candidates.append(("full kaggle.json secret", parsed, None))
          elif partial_user and partial_key:
              candidates.append(("recovered username/key fields",
                                 {"username": partial_user, "key": partial_key}, None))
          pair_labels = {"username", "key", "token", "api", "access", "authorization",
                         "bearer", "http", "https"}
          for match in re.finditer(
              r"([A-Za-z0-9][A-Za-z0-9._-]{1,63})\s*:\s*([A-Za-z0-9][A-Za-z0-9._~+\-/=]{15,})", raw):
              pair_user, pair_key = match.group(1), match.group(2).strip("._~+-/=")
              if pair_user.lower() not in pair_labels and len(pair_key) >= 16:
                  secret_values.append(pair_key)
                  candidates.append(("recovered username:key pair",
                                     {"username": pair_user, "key": pair_key}, None))
          if key_in and partial_user and not user_in:
              candidates.append(("key secret + recovered username",
                                 {"username": partial_user, "key": key_in}, None))
          legacy_users = []
          for possible_user in (user_in, partial_user):
              if possible_user and possible_user not in legacy_users:
                  legacy_users.append(possible_user)
          for token in tokens:
              label = ("extracted Kaggle API token" if token != raw
                       else "pasted value as Kaggle API token")
              candidates.append((label, None, token))
              for legacy_user in legacy_users:
                  candidates.append(("extracted value as legacy key + recovered username",
                                     {"username": legacy_user, "key": token}, None))

          unique, seen = [], set()
          for candidate in candidates:
              signature = (json.dumps(candidate[1], sort_keys=True) if candidate[1] else "",
                           candidate[2] or "")
              if signature not in seen:
                  seen.add(signature)
                  unique.append(candidate)
          candidates = unique[:20]

          shape = {
              "secret_present": bool(raw),
              "secret_length": len(raw),
              "line_count": (raw.count("\n") + 1 if raw else 0),
              "compact_length": len(compact),
              "generic_token_lengths": [len(v) for v in generic],
              "token_candidate_lengths": [len(v) for v in tokens],
              "recovered_username": bool(partial_user),
              "candidate_kinds": [c[0] for c in candidates],
          }
          shape_json = json.dumps(shape, indent=2, sort_keys=True)
          print("credential shape metadata (no secret values):", shape_json)
          summary("Credential shape metadata (no secret values):\n\n```json\n" + shape_json + "\n```")

          if not candidates:
              msg = ("### Kaggle preflight — credential diagnosis\n\n"
                     "No credential candidate was found in the stored secret. "
                     "No secret value was printed.")
              summary(msg)
              print("::error::" + msg.replace("\n", " "))
              sys.exit(1)

          winner = None
          for name, cred, token in candidates:
              env = dict(base_env)
              set_file(cred)
              if token:
                  env["KAGGLE_API_TOKEN"] = token
              rc, out = cli(["datasets", "list", "--mine"], env)
              print(f"attempt [{name}]: rc={rc}")
              if out:
                  print("   tail:", " | ".join(out.splitlines()[-2:])[:300])
              if rc == 0:
                  winner = (name, cred, token, env)
                  break

          if not winner:
              set_file(None)
              summary("### Kaggle preflight — credential diagnosis\n\n"
                      "None of the credential candidates authenticated on Kaggle.")
              print("::error::no credential candidate authenticated — see job summary")
              sys.exit(1)

          name, cred, token, env = winner
          genv = os.environ.get("GITHUB_ENV")
          username = cred["username"] if cred else ""
          if token:
              if genv:
                  open(genv, "a").write(f"KAGGLE_API_TOKEN={token}\n")
              rc, out = cli(["config", "view"], env)
              for line in out.splitlines():
                  if "username" in line.lower() and ":" in line:
                      parsed_user = line.split(":", 1)[1].strip().strip("\"'")
                      if (parsed_user.lower() not in ("", "none", "null")
                              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", parsed_user)):
                          username = parsed_user
                          break
              if not username and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", user_in or ""):
                  username = user_in
          if not username:
              summary("### Kaggle preflight — credential diagnosis\n\n"
                      "The token authenticated, but the Kaggle username could not be resolved.")
              print("::error::token authenticated but username unresolved — see job summary")
              sys.exit(1)
          if genv:
              open(genv, "a").write(f"KAGGLE_USERNAME={username}\n")
          print(f"credentials OK via [{name}] | username: {username}")
          summary(f"Kaggle credentials resolved via **{name}** (username: {username}).")
          PY

      - name: Build tiny GPU probe kernel
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > probe/kernel-metadata.json << JSON
          {
            "id": "$KAGGLE_USERNAME/cine-engine-gpu-probe",
            "title": "cine-engine-gpu-probe",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON
          cat > probe/probe.py << 'PY'
          import json, os, shutil, subprocess, sys, time
          print("python:", sys.version)
          info = {}
          smi_candidates = [
              shutil.which("nvidia-smi"),
              "/usr/bin/nvidia-smi",
              "/usr/local/nvidia/bin/nvidia-smi",
              "/opt/bin/nvidia-smi",
          ]
          smi_path = next((p for p in smi_candidates if p and os.path.isfile(p)), None)
          info["nvidia_smi_path"] = smi_path
          print("== nvidia-smi ==")
          if smi_path:
              try:
                  r = subprocess.run([smi_path], capture_output=True, text=True)
                  print(r.stdout or r.stderr)
                  info["nvidia_smi_exit"] = r.returncode
              except Exception as exc:  # named, never hidden
                  info["nvidia_smi_exit"] = None
                  info["nvidia_smi_error"] = f"{type(exc).__name__}: {exc}"
          else:
              info["nvidia_smi_exit"] = None
              info["nvidia_smi_error"] = "nvidia-smi not found on PATH or common GPU locations"
              print(info["nvidia_smi_error"])
          try:
              import torch
              info["torch"] = torch.__version__
              info["cuda_available"] = torch.cuda.is_available()
              info["device_count"] = torch.cuda.device_count()
              if torch.cuda.is_available():
                  info["device"] = torch.cuda.get_device_name(0)
                  info["devices"] = [torch.cuda.get_device_name(i) for i in range(info["device_count"])]
                  info["vram_gb"] = round(torch.cuda.get_device_properties(0).total_memory / 1e9, 2)
                  x = torch.randn(1024, 1024, device="cuda")
                  t0 = time.time()
                  for _ in range(20):
                      x = x @ x
                  torch.cuda.synchronize()
                  info["matmul20_seconds"] = round(time.time() - t0, 3)
          except Exception as exc:  # named, never hidden
              info["torch_error"] = f"{type(exc).__name__}: {exc}"
          try:
              import shutil
              u = shutil.disk_usage("/kaggle/working")
              info["disk_working_gb"] = round(u.total / 1e9, 1)
          except Exception:
              pass
          json.dump(info, open("/kaggle/working/gpu_probe.json", "w"), indent=2)
          print("PROBE_JSON:", json.dumps(info))
          PY
          ls -la probe

      - name: Push probe kernel and wait for the GPU verdict
        run: |
          set -euo pipefail
          kaggle kernels push -p probe --accelerator NvidiaTeslaT4
          kernel_state="timeout"
          for i in $(seq 1 40); do
            out=$(kaggle kernels status "$KAGGLE_USERNAME/cine-engine-gpu-probe" 2>&1 || true)
            echo "poll $i: $out"
            low=$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')
            case "$low" in
              *complete*) kernel_state="complete"; echo "kernel complete"; break ;;
              *error*|*cancel*) kernel_state="error"; break ;;
            esac
            sleep 30
          done
          if [ "$kernel_state" != "complete" ]; then
            echo "::error::kernel did not complete successfully (state: $kernel_state) — read probe_out logs in summary/artifact"
            exit 1
          fi

      - name: Fetch probe output and write summary (phone-readable)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p probe_out
          if [ -n "${KAGGLE_USERNAME:-}" ]; then
            kaggle kernels output "$KAGGLE_USERNAME/cine-engine-gpu-probe" -p probe_out || true
          else
            echo "no username (credentials step failed earlier) — nothing to fetch"
          fi
          ls -la probe_out || true
          {
            echo "### Kaggle GPU preflight (run ${{ github.run_id }})"
            echo
            if [ -f probe_out/gpu_probe.json ]; then
              echo '```json'
              cat probe_out/gpu_probe.json
              echo
              echo '```'
            else
              echo "_no gpu_probe.json returned — kernel log below tells why._"
            fi
            for f in probe_out/*.log; do
              if [ -f "$f" ]; then
                echo
                echo "#### $f"
                echo '```'
                tail -c 4000 "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - << 'PY'
          import json, os, sys
          path = "probe_out/gpu_probe.json"
          if not os.path.isfile(path):
              print("::error::GPU NOT PROVEN: gpu_probe.json was not returned")
              sys.exit(1)
          try:
              info = json.load(open(path))
          except Exception as exc:  # named, never hidden
              print(f"::error::GPU NOT PROVEN: could not parse gpu_probe.json ({type(exc).__name__}: {exc})")
              sys.exit(1)
          if info.get("cuda_available") is not True or not info.get("device_count"):
              verdict = {
                  "nvidia_smi_exit": info.get("nvidia_smi_exit"),
                  "nvidia_smi_error": info.get("nvidia_smi_error"),
                  "cuda_available": info.get("cuda_available"),
                  "device_count": info.get("device_count"),
                  "torch_error": info.get("torch_error"),
              }
              print("::error::GPU NOT PROVEN:", json.dumps(verdict, sort_keys=True))
              sys.exit(1)
          print(f"GPU PROVEN: {info.get('device')} | VRAM {info.get('vram_gb')} GB | devices {info.get('device_count')}")
          PY

      - name: Upload probe artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-probe-${{ github.run_id }}
          path: probe_out/
          if-no-files-found: warn
